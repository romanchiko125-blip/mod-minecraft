buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'

version = project.findProperty('modVersion') ?: '1.0.0'
group = 'com.example.cityvillages'
archivesBaseName = 'cityvillages'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    // Forge 26.1.2 = Minecraft 1.13.2
    mappings channel: 'snapshot', version: '20180921-1.13'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                cityvillages {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                cityvillages {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.13.2-26.1.2'
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'cityvillages',
                'Specification-Vendor': 'example',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': "${version}",
                'Implementation-Vendor': 'example'
        ])
    }
}
